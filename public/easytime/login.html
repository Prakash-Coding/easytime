<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — EasyTime</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="workforce-design.css?v=20261117"></head><body class="auth-page"><main class="auth-card panel"><a class="brand" href="index.html"><span class="brand-icon">◷</span>EasyTime<span class="brand-dot"></span></a><h1>Your hours. Your own space.</h1><p class="muted">Sign in to keep your records together across devices.</p><a id="chatgpt-login" class="button" href="/signin-with-chatgpt?return_to=%2Feasytime%2Findex.html" target="_top">Continue with ChatGPT</a><p class="auth-divider">or use your EasyTime account</p><div id="provider-status" class="notice">Checking email and Google sign-in…</div><div id="google-login"></div><form id="auth-form"><div><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"></div><div id="password-field"><label for="password">Password</label><div style="display:flex;gap:8px"><input id="password" name="password" type="password" minlength="10" maxlength="128" autocomplete="current-password" required placeholder="At least 10 characters"><button id="show-password" type="button" class="mini-action" aria-label="Show password">Show</button></div></div><button id="submit-auth" class="button secondary" disabled>Sign in with email</button></form><div class="auth-tabs"><button type="button" data-mode="login">Sign in</button><button type="button" data-mode="signup">Create account</button><button type="button" data-mode="reset">Forgot password?</button></div><p id="auth-message" class="notice" role="status" hidden></p><p class="auth-footer">Your records are private to your signed-in account.<br><a href="calculator.html">Open the offline calculator</a></p><noscript><p>Use Continue with ChatGPT above. JavaScript is needed for email sign-in.</p></noscript></main><script type="module" src="auth.mjs"></script></body></html>
